name: Desktop build (Windows, macOS)
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "profiles/**"
      - "third_party/byedpi/**"
      - ".github/workflows/desktop.yml"

jobs:
  byedpi-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build ciadpi.exe
        run: make -C third_party/byedpi windows CC=x86_64-w64-mingw32-gcc WIN_LDFLAGS="-lws2_32 -lmswsock -static"
      - uses: actions/upload-artifact@v4
        with:
          name: ciadpi-windows
          path: third_party/byedpi/ciadpi.exe

  byedpi-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ciadpi (Apple Silicon + Intel)
        run: |
          cd third_party/byedpi
          make clean
          make CC="clang -arch arm64"
          mv ciadpi ciadpi-arm64
          make clean
          make CC="clang -arch x86_64"
          mv ciadpi ciadpi-x64
          lipo -create -output ciadpi ciadpi-arm64 ciadpi-x64
          lipo -info ciadpi
      - uses: actions/upload-artifact@v4
        with:
          name: ciadpi-macos
          path: third_party/byedpi/ciadpi

  windows:
    needs: byedpi-windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ciadpi-windows
          path: desktop/resources/bin/win32
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: WolfTower-windows
          path: desktop/dist/*.exe

  macos:
    needs: byedpi-macos
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ciadpi-macos
          path: desktop/resources/bin/darwin
      - run: chmod +x resources/bin/darwin/ciadpi
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: WolfTower-mac
          path: desktop/dist/*.dmg

  smoke:
    # Проверка на настоящих Windows и macOS: запуск ciadpi, SOCKS5, HTTPS, системный прокси (Windows)
    needs: [byedpi-windows, byedpi-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ciadpi-windows
            dir: win32
          - os: macos-latest
            artifact: ciadpi-macos
            dir: darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/resources/bin/${{ matrix.dir }}
      - run: chmod +x resources/bin/darwin/ciadpi
        if: runner.os == 'macOS'
      - run: npm ci
      - run: node test/run.js
        continue-on-error: true
      - run: node test/ci-smoke.js
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log-${{ matrix.os }}
          path: desktop/smoke-log.txt
